<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAYA MENU</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.5.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Favicon -->
    <link rel="icon" href="images/favicon.jpg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Croissant+One&family=Handlee&family=Kalam&family=Montserrat:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Lora:ital,wght@1,400;1,600;1,700&family=Poppins:ital,wght@0,200;1,100;1,700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome (corrected link) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
</head>
<body>
    <!-- Navigation starts here -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <!-- Add your brand/logo here -->
                <a class="navbar-brand" href="#">
                    <i class="fas fa-utensils"></i> OUR MENU
                </a>
                
                <!-- Toggle button for smaller screens -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- Corrected div closing tag placement -->
            </div>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Centered Menu Section -->
    <div class="centered-menu-section">
        <div class="menu-container">
            <!-- Carousel -->
            <div id="menuCarousel" class="carousel slide" data-bs-ride="carousel">
                <!-- Indicators -->
                <ol class="carousel-indicators">
                    <li data-bs-target="#menuCarousel" data-bs-slide-to="0" class="active"></li>
                    <li data-bs-target="#menuCarousel" data-bs-slide-to="1"></li>
                    <li data-bs-target="#menuCarousel" data-bs-slide-to="2"></li>
                </ol>

                <!-- Slides -->
                <div class="carousel-inner">
                    <!-- First Menu Page -->
                    <div class="carousel-item active">
                        <div class="menu-list menu-List-breakfast">
                            <h2>BREAKFAST</h2>
                            <table>
                                <tr>
                                    <td>Dawa</td>
                                    <td>200</td>
                                </tr>
                                <tr>
                                    <td>Hot Chocolate</td>
                                    <td>200</td>
                                </tr>
                                <tr>
                                    <td>White Coffee</td>
                                    <td>200</td>
                                </tr>
                                <tr>
                                    <td>Black Coffee</td>
                                    <td>150</td>
                                </tr>
                                <tr>
                                    <td>Lemon Tea</td>
                                    <td>100</td>
                                </tr>
                                <tr>
                                    <td>Milk</td>
                                    <td>100</td>
                                </tr>
                                <tr>
                                    <td>African Tea</td>
                                    <td>70</td>
                                </tr>
                            </table>
                        </div>
                    </div>

                    <!-- Second Menu Page -->
                    <div class="carousel-item">
                        <div class="menu-list menu-list-snacks">
                            <h2>SNACKS</h2>
                            <table>
                                <tr>
                                    <td>Spanish Omelette</td>
                                    <td>120.00</td>
                                </tr>
                                <!-- Add more snack items here -->
                            </table>
                        </div>
                    </div>

                    <!-- Add more menu pages here (copy the structure of the second menu page) -->
                </div>

                <!-- Controls -->
                <a class="carousel-control-prev" href="#menuCarousel" role="button" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="sr-only">Previous</span>
                </a>
                <a class="carousel-control-next" href="#menuCarousel" role="button" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="sr-only">Next</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript and jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.5.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
